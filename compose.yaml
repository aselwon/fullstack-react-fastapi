x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-relaydesk}:${POSTGRES_PASSWORD:-relaydesk-local}@db:5432/${POSTGRES_DB:-relaydesk}
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-development-only-change-before-deploying}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
  UPLOAD_DIR: /data/uploads
  WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-true}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-relaydesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-relaydesk-local}
      POSTGRES_DB: ${POSTGRES_DB:-relaydesk}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U ${POSTGRES_USER:-relaydesk} -d ${POSTGRES_DB:-relaydesk}']
      interval: 3s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./apps/api
    environment: *api-env
    command: sh -c 'alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000'
    ports: ['127.0.0.1:${API_PORT:-8000}:8000']
    volumes: [uploads:/data/uploads]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 5s
      timeout: 3s
      retries: 20
  worker:
    build: ./apps/api
    environment: *api-env
    command: python -m app.webhooks
    depends_on:
      api: {condition: service_healthy}
      webhook-sink: {condition: service_started}
    restart: unless-stopped
  webhook-sink:
    image: python:3.12-alpine
    command: python /app/webhook_sink.py
    volumes: ['./scripts/webhook_sink.py:/app/webhook_sink.py:ro']
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ['127.0.0.1:${WEB_PORT:-3000}:3000']
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
  uploads:
